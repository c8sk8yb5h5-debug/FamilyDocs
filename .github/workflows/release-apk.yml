name: Build and publish FamilyDocs update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        default: Bug fixes and improvements
        type: string

permissions:
  contents: write

concurrency:
  group: familydocs-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set build version
        shell: bash
        run: |
          VERSION="0.3.${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=${{ inputs.notes || 'Bug fixes and improvements' }}" >> "$GITHUB_ENV"
      - name: Prepare persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILYDOCS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILYDOCS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FAMILYDOCS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FAMILYDOCS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing FAMILYDOCS_KEYSTORE_BASE64 secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/familydocs-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familydocs-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/familydocs-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FamilyDocs.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FamilyDocs ${{ env.RELEASE_TAG }}
          body: ${{ env.RELEASE_NOTES }}
          files: app/build/outputs/apk/release/FamilyDocs.apk
          fail_on_unmatched_files: true
          make_latest: true
